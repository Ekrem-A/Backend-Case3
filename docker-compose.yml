# 12-Factor App: Docker Compose
# Tüm servisleri tek bir komutla başlatma

version: '3.8'

services:
  # SQL Server Database (Docker Container)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: backend-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Ekoo@3003
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Ekoo@3003" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend-network

  # Identity API
  identity-api:
    build:
      context: .
      dockerfile: Identity.Api/Dockerfile
    container_name: backend-identity-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Docker içindeki SQL Server'a bağlantı
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=IdentityDb;User Id=sa;Password=Ekoo@3003;TrustServerCertificate=True
      - JwtSettings__SecretKey=ahfgkmcnhfgyruıoplksgerwqhnvbcgr
      - JwtSettings__Issuer=IdentityApi
      - JwtSettings__Audience=BackendServices
      - JwtSettings__AccessTokenExpirationMinutes=15
      - JwtSettings__RefreshTokenExpirationDays=7
    ports:
      - "5101:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8080/health/live || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API Gateway with YARP
  gateway-api:
    build:
      context: .
      dockerfile: Gateway.Api/Dockerfile
    container_name: backend-gateway-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - JwtSettings__SecretKey=ahfgkmcnhfgyruıoplksgerwqhnvbcgr
      - JwtSettings__Issuer=IdentityApi
      - JwtSettings__Audience=BackendServices
      - ReverseProxy__Clusters__identity-cluster__Destinations__identity-api__Address=http://identity-api:8080
      - ReverseProxy__Clusters__products-cluster__Destinations__products-api__Address=http://products-api:8080
    ports:
      - "5100:8080"
    depends_on:
      identity-api:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8080/health/live || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
