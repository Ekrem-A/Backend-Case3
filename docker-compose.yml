# 12-Factor App: Docker Compose
# Tüm servisleri tek bir komutla başlatma

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: backend-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Ekoo@3003
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Ekoo@3003" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: backend-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: redis-cli ping | grep PONG || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-network

  # Zookeeper (Kafka için gerekli)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: backend-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - backend-network

  # Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: backend-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - backend-network

  # Kafka UI (Opsiyonel - Kafka yönetim arayüzü)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: backend-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: backend-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - backend-network

  # Identity API
  identity-api:
    build:
      context: .
      dockerfile: services/Identity/Identity.Api/Dockerfile
    container_name: backend-identity-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=IdentityDb;User Id=sa;Password=Ekoo@3003;TrustServerCertificate=True
      - JwtSettings__SecretKey=ahfgkmcnhfgyruıoplksgerwqhnvbcgr
      - JwtSettings__Issuer=IdentityApi
      - JwtSettings__Audience=BackendServices
      - JwtSettings__AccessTokenExpirationMinutes=15
      - JwtSettings__RefreshTokenExpirationDays=7
    ports:
      - "5101:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8080/health/live || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Products API (CQRS + Kafka + Redis Cache)
  products-api:
    build:
      context: .
      dockerfile: services/Products/Products.Api/Dockerfile
    container_name: backend-products-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ProductsDb;User Id=sa;Password=Ekoo@3003;TrustServerCertificate=True
      - JwtSettings__SecretKey=ahfgkmcnhfgyruıoplksgerwqhnvbcgr
      - JwtSettings__Issuer=IdentityApi
      - JwtSettings__Audience=BackendServices
      - Redis__Enabled=true
      - Redis__ConnectionString=redis:6379
      - Kafka__Enabled=true
      - Kafka__BootstrapServers=kafka:29092
      - Kafka__ProductEventsTopic=product-events
      - Kafka__GroupId=products-service
    ports:
      - "5102:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8080/health/live || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API Gateway with YARP
  gateway-api:
    build:
      context: .
      dockerfile: gateway/Gateway.Api/Dockerfile
    container_name: backend-gateway-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # JWT Settings
      - JwtSettings__SecretKey=ahfgkmcnhfgyruıoplksgerwqhnvbcgr
      - JwtSettings__Issuer=IdentityApi
      - JwtSettings__Audience=BackendServices
      # Reverse Proxy - Identity Cluster
      - ReverseProxy__Clusters__identity-cluster__Destinations__identity-api__Address=http://identity-api:8080
      # Reverse Proxy - Products Cluster
      - ReverseProxy__Clusters__products-cluster__Destinations__products-api__Address=http://products-api:8080
    ports:
      - "5100:8080"
    depends_on:
      identity-api:
        condition: service_healthy
      products-api:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8080/health/live || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
  redis_data:
    driver: local
