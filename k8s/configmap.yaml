# ConfigMap - Shared Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: backend-services
  labels:
    app.kubernetes.io/name: backend-services
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  SEQ_URL: "http://seq-service:80"
  REDIS_CONNECTION: "redis-service:6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  JWT_ISSUER: "IdentityApi"
  JWT_AUDIENCE: "BackendServices"
