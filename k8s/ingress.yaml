# Ingress Controller Configuration (NGINX)
# TLS ile dýþ dünyaya açýlým
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: backend-services
  labels:
    app.kubernetes.io/name: backend-ingress
  annotations:
    # NGINX Ingress Controller
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Rate Limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Body Size
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Correlation-ID"
    # TLS with cert-manager (Let's Encrypt)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.eko.com
      secretName: backend-tls-secret
  rules:
    - host: api.eko.com
      http:
        paths:
          # Tüm trafik Gateway API'ye yönlendirilir
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-api-service
                port:
                  number: 80
---
# Seq Dashboard için ayrý Ingress (opsiyonel, internal)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seq-ingress
  namespace: backend-services
  annotations:
    kubernetes.io/ingress.class: nginx
    # Basic Auth (internal access için)
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: seq-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Seq Log Server"
spec:
  ingressClassName: nginx
  rules:
    - host: logs.eko.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seq-service
                port:
                  number: 80
