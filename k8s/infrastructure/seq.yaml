# Seq Log Server - Docker Compose ile uyumlu
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seq
  namespace: backend-services
  labels:
    app: seq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seq
  template:
    metadata:
      labels:
        app: seq
    spec:
      containers:
        - name: seq
          image: datalust/seq:latest
          ports:
            - containerPort: 80
              name: web
            - containerPort: 5341
              name: ingestion
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: SEQ_FIRSTRUN_ADMINUSERNAME
              value: "admin"
            - name: SEQ_FIRSTRUN_ADMINPASSWORD
              value: "admin123"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: seq-service
  namespace: backend-services
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: web
    - port: 5341
      targetPort: 5341
      nodePort: 30341
      name: ingestion
  selector:
    app: seq
