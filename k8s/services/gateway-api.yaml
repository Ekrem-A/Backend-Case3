# Gateway API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: backend-services
  labels:
    app: gateway-api
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
        version: v1
    spec:
      containers:
        - name: gateway-api
          image: backend-gateway-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: JwtSettings__SecretKey
              value: "ahfgkmcnhfgyruioplksgerwqhnvbcgr1234567890"
            - name: JwtSettings__Issuer
              value: "IdentityApi"
            - name: JwtSettings__Audience
              value: "BackendServices"
            - name: Redis__ConnectionString
              value: "redis-service:6379"
            - name: ReverseProxy__Clusters__identity-cluster__Destinations__identity-api__Address
              value: "http://identity-api-service:80"
            - name: ReverseProxy__Clusters__products-cluster__Destinations__products-api__Address
              value: "http://products-api-service:80"
            - name: SEQ_URL
              value: "http://seq-service:5341"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api-service
  namespace: backend-services
  labels:
    app: gateway-api
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30100
      name: http
  selector:
    app: gateway-api
