# Network Policies - Pod'lar arasý trafiði kontrol et
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: backend-services
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Gateway API - Dýþ dünyadan gelen trafiði kabul et
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-api-policy
  namespace: backend-services
spec:
  podSelector:
    matchLabels:
      app: gateway-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx  # Ingress controller namespace
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: identity-api
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: products-api
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: seq
      ports:
        - protocol: TCP
          port: 80
    # DNS çözümlemesi için
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
---
# Identity API - Sadece Gateway'den gelen trafiði kabul et
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-api-policy
  namespace: backend-services
spec:
  podSelector:
    matchLabels:
      app: identity-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway-api
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: sqlserver
      ports:
        - protocol: TCP
          port: 1433
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: seq
      ports:
        - protocol: TCP
          port: 80
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
---
# Products API - Gateway'den gelen trafiði kabul et
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: products-api-policy
  namespace: backend-services
spec:
  podSelector:
    matchLabels:
      app: products-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway-api
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: sqlserver
      ports:
        - protocol: TCP
          port: 1433
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - podSelector:
            matchLabels:
              app: seq
      ports:
        - protocol: TCP
          port: 80
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
---
# SQL Server - Sadece servislerden gelen baðlantýlarý kabul et
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sqlserver-policy
  namespace: backend-services
spec:
  podSelector:
    matchLabels:
      app: sqlserver
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: identity-api
        - podSelector:
            matchLabels:
              app: products-api
      ports:
        - protocol: TCP
          port: 1433
---
# Redis - Servislerden gelen baðlantýlarý kabul et
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: backend-services
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: identity-api
        - podSelector:
            matchLabels:
              app: products-api
        - podSelector:
            matchLabels:
              app: gateway-api
      ports:
        - protocol: TCP
          port: 6379
